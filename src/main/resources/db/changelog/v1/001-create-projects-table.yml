databaseChangeLog:
  - changeSet:
      id: 1
      author: woody-rn
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: projects
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: github_url
                  type: VARCHAR(255)
              - column:
                  name: live_url
                  type: VARCHAR(255)
              - column:
                  name: image_url
                  type: VARCHAR(255)