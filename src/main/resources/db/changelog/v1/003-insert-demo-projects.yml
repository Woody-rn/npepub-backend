databaseChangeLog:
  - changeSet:
      id: 3
      author: woody-rn
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM projects
      changes:
        - insert:
            tableName: projects
            columns:
              - column: { name: title, value: 'npepub.ru' }
              - column: { name: description, value: 'Личный сайт-портфолио. Стек: Spring Boot, React, Docker.' }
              - column: { name: github_url, value: 'https://github.com/woody-rn/npepub-backend' }
