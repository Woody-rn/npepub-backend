              - column: { name: github_url, value: 'https://github.com/woody-rn/task-tracker' }
              - column: { name: image_url, value: '/images/tasktracker.png' }

        - insert:
            tableName: projects
            columns:
              - column: { name: title, value: 'URL Shortener' }
